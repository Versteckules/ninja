<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ninja Hero - GC Finale</title>
    
    <style>
        html,
        body {
          height: 100%;
          margin: 0;
          overflow: hidden; 
        }

        body {
          font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
          cursor: pointer;
          background-color: #1a1a1a; 
          user-select: none; 
        }

        .container {
          display: flex;
          justify-content: center;
          align-items: center;
          height: 100%;
        }

        /* START: Wasserzeichen */
        #watermark {
          position: fixed;
          top: 50%;
          left: 50%;
          transform: translate(-50%, -50%);
          z-index: 5;
          opacity: 0.08; 
          pointer-events: none; 
        }
        #watermark img {
          max-width: 80vw;
          max-height: 60vh;
          border-radius: 15px;
          object-fit: contain;
        }
        /* ENDE: Wasserzeichen */

        /* START: Startmenü */
        #start-menu {
          position: fixed;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          background: #1a1a1a; 
          z-index: 1000;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          text-align: center;
        }
        #start-menu img {
          width: 180px; 
          height: auto; 
          max-height: 250px; 
          border-radius: 15px;
          object-fit: contain; 
          margin-bottom: 25px;
          background-color: #2ecc71; 
          border: 3px solid #2ecc71;
          box-shadow: 0 0 30px rgba(46, 204, 113, 0.5);
          padding: 5px; 
        }
        #start-menu h1 {
          color: #2ecc71;
          font-size: 3em;
          margin: 0;
          text-shadow: 0 0 15px rgba(46, 204, 113, 0.5);
        }
        #start-menu p {
          color: #95a5a6;
          font-style: italic;
          margin-top: 5px;
          font-size: 1.2em;
        }
        #btn-start-game {
          margin-top: 40px;
          background: #e74c3c;
          color: white;
          border: none;
          padding: 15px 40px;
          font-size: 1.2em;
          font-weight: bold;
          border-radius: 25px;
          cursor: pointer;
          box-shadow: 0 4px 15px rgba(231, 76, 60, 0.4);
          text-transform: uppercase;
        }
        /* ENDE: Startmenü */

        #score {
          position: absolute;
          top: 30px;
          right: 30px;
          font-size: 2em;
          font-weight: 900;
          z-index: 10;
        }

        #introduction {
          width: 250px;
          position: absolute;
          font-weight: 600;
          font-size: 1em;
          font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
          text-align: center;
          transition: opacity 2s;
          z-index: 10;
          background: rgba(255,255,255,0.8);
          padding: 15px;
          border-radius: 10px;
        }

        #restart {
          width: 120px;
          height: 120px;
          position: absolute;
          border-radius: 50%;
          color: white;
          background-color: red;
          border: none;
          font-weight: 700;
          font-size: 1.2em;
          font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
          display: none;
          cursor: pointer;
          z-index: 20;
          box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        #perfect {
          position: absolute;
          opacity: 0;
          transition: opacity 2s;
          font-weight: bold;
          color: #e74c3c;
          font-size: 1.5em;
          z-index: 10;
        }
    </style>
</head>
<body>

    <!-- START: Startmenü Overlay -->
    <div id="start-menu">
        <img src="avatar.jpg" alt="Avatar">
        <h1>Ninja Hero</h1>
        <p>made by versteckules</p>
        <button id="btn-start-game">Spiel Starten</button>
    </div>

    <!-- START: Wasserzeichen (Sanft im Hintergrund) -->
    <div id="watermark">
        <img src="avatar.jpg" alt="Avatar Watermark">
    </div>

    <div class="container">
      <div id="score">0</div>
      <canvas id="game"></canvas>
      <div id="introduction">
          Halte den Bildschirm gedrückt, um die Brücke zu bauen.<br><br>
          <!-- ZIEL AUF 15 ANGEPASST -->
          <span style="color: #e74c3c; font-weight: bold;">ZIEL: 15 PUNKTE</span>
      </div>
      <div id="perfect">PERFEKT! +2</div>
      <button id="restart">NEUSTART</button>
    </div>

    <!-- START: Vollbild Geocaching-Sieger-Popup -->
    <div id="victory-popup" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(20, 25, 30, 0.95); z-index: 2147483647; flex-direction: column; justify-content: center; align-items: center; text-align: center; font-family: 'Segoe UI', Tahoma, sans-serif;">
        <div style="background: rgba(0,0,0,0.6); padding: 40px 20px; border-radius: 20px; border: 2px solid #2ecc71; box-shadow: 0 0 40px rgba(46, 204, 113, 0.4); width: 85%; max-width: 400px;">
            <h1 style="color: #2ecc71; font-size: 32px; font-weight: 900; margin: 0 0 15px 0; text-shadow: 0 0 15px #2ecc71; letter-spacing: 1px;">SYSTEM GEKNACKT</h1>
            <p style="color: #ecf0f1; font-size: 18px; margin-bottom: 25px;">Glückwunsch! Hier sind die Final-Koordinaten:</p>
            <div style="background: #111; padding: 15px; border-radius: 10px; border: 1px solid #e74c3c; box-shadow: inset 0 0 10px rgba(231, 76, 60, 0.3);">
                <span id="secret-coords" style="color: #e74c3c; font-family: monospace; font-size: 22px; font-weight: bold; letter-spacing: 1px;"></span>
            </div>
            <p style="color: #95a5a6; font-size: 14px; margin-top: 20px; margin-bottom: 30px;">(Am besten sofort einen Screenshot machen!)</p>
        </div>
    </div>
    <!-- ENDE: Sieger-Popup -->


    <script>
        // Extend the base functionality of JavaScript
        Array.prototype.last = function () {
          return this[this.length - 1];
        };

        Math.sinus = function (degree) {
          return Math.sin((degree / 180) * Math.PI);
        };

        // Game data
        let phase = "waiting"; 
        let lastTimestamp; 

        let heroX; 
        let heroY; 
        let sceneOffset; 

        let platforms = [];
        let sticks = [];
        let trees = [];

        let score = 0;
        let cacheKnacked = false;
        let isGameReady = false; 
        let lastRestartTime = 0; // <-- NEU: Zeiterfassung für Restart

        // Configuration
        const canvasWidth = 375;
        const canvasHeight = 375;
        const platformHeight = 100;
        const heroDistanceFromEdge = 10; 
        const paddingX = 100; 
        const perfectAreaSize = 10;

        const backgroundSpeedMultiplier = 0.2;

        const hill1BaseHeight = 100;
        const hill1Amplitude = 10;
        const hill1Stretch = 1;
        const hill2BaseHeight = 70;
        const hill2Amplitude = 20;
        const hill2Stretch = 0.5;

        const stretchingSpeed = 4; 
        const turningSpeed = 4; 
        const walkingSpeed = 4;
        const transitioningSpeed = 2;
        const fallingSpeed = 2;

        const heroWidth = 17; 
        const heroHeight = 30; 

        const canvas = document.getElementById("game");
        canvas.width = window.innerWidth; 
        canvas.height = window.innerHeight;

        const ctx = canvas.getContext("2d");

        const introductionElement = document.getElementById("introduction");
        const perfectElement = document.getElementById("perfect");
        const restartButton = document.getElementById("restart");
        const scoreElement = document.getElementById("score");

        // UI-Steuerung für das Startmenü
        const startMenuBtn = document.getElementById("btn-start-game");
        const startMenu = document.getElementById("start-menu");

        startMenuBtn.addEventListener("click", function(e) {
            e.stopPropagation();
            startMenu.style.display = "none";
            isGameReady = true;
        });
        startMenuBtn.addEventListener("touchstart", function(e) {
            e.preventDefault(); 
            e.stopPropagation();
            startMenu.style.display = "none";
            isGameReady = true;
        });

        // Initialize layout
        resetGame();

        function resetGame() {
          phase = "waiting";
          lastTimestamp = undefined;
          sceneOffset = 0;
          score = 0;
          
          lastRestartTime = Date.now(); // <-- Speichert die exakte Zeit des Neustarts

          introductionElement.style.opacity = 1;
          perfectElement.style.opacity = 0;
          restartButton.style.display = "none";
          scoreElement.innerText = score;

          platforms = [{ x: 50, w: 50 }];
          generatePlatform();
          generatePlatform();
          generatePlatform();
          generatePlatform();

          sticks = [{ x: platforms[0].x + platforms[0].w, length: 0, rotation: 0 }];

          trees = [];
          for (let i = 0; i < 10; i++) {
            generateTree();
          }

          heroX = platforms[0].x + platforms[0].w - heroDistanceFromEdge;
          heroY = 0;

          draw();
        }

        function generateTree() {
          const minimumGap = 30;
          const maximumGap = 150;
          const lastTree = trees[trees.length - 1];
          let furthestX = lastTree ? lastTree.x : 0;
          const x = furthestX + minimumGap + Math.floor(Math.random() * (maximumGap - minimumGap));
          const treeColors = ["#6D8821", "#8FAC34", "#98B333"];
          const color = treeColors[Math.floor(Math.random() * 3)];
          trees.push({ x, color });
        }

        function generatePlatform() {
          const minimumGap = 40;
          const maximumGap = 200;
          const minimumWidth = 20;
          const maximumWidth = 100;
          const lastPlatform = platforms[platforms.length - 1];
          let furthestX = lastPlatform.x + lastPlatform.w;
          const x = furthestX + minimumGap + Math.floor(Math.random() * (maximumGap - minimumGap));
          const w = minimumWidth + Math.floor(Math.random() * (maximumWidth - minimumWidth));
          platforms.push({ x, w });
        }

        // Steuerung
        window.addEventListener("mousedown", handleStart);
        window.addEventListener("touchstart", handleStart, {passive: false});
        
        window.addEventListener("mouseup", handleEnd);
        window.addEventListener("touchend", handleEnd);

        function handleStart(event) {
          if (!isGameReady) return; 
          
          // <-- NEU: Blockiert gnadenlos alle Eingaben für 0,5 Sekunden nach dem Neustart
          // Das tötet jeden "Ghost Click" des Handys ab.
          if (Date.now() - lastRestartTime < 500) return; 
          
          if (event.type === 'touchstart') event.preventDefault();
          
          if (phase == "waiting") {
            lastTimestamp = undefined;
            introductionElement.style.opacity = 0;
            phase = "stretching";
            window.requestAnimationFrame(animate);
          }
        }

        function handleEnd(event) {
          if (!isGameReady) return;
          if (Date.now() - lastRestartTime < 500) return; // Greift auch hier als Sicherheit
          
          if (phase == "stretching") {
            phase = "turning";
          }
        }

        window.addEventListener("resize", function (event) {
          canvas.width = window.innerWidth;
          canvas.height = window.innerHeight;
          draw();
        });

        window.requestAnimationFrame(animate);

        function animate(timestamp) {
          if (!lastTimestamp) {
            lastTimestamp = timestamp;
            window.requestAnimationFrame(animate);
            return;
          }

          switch (phase) {
            case "waiting":
              return; 
            case "stretching": {
              sticks.last().length += (timestamp - lastTimestamp) / stretchingSpeed;
              break;
            }
            case "turning": {
              sticks.last().rotation += (timestamp - lastTimestamp) / turningSpeed;

              if (sticks.last().rotation > 90) {
                sticks.last().rotation = 90;

                const [nextPlatform, perfectHit] = thePlatformTheStickHits();
                if (nextPlatform) {
                  score += perfectHit ? 2 : 1;
                  scoreElement.innerText = score;

                  if (perfectHit) {
                    perfectElement.style.opacity = 1;
                    setTimeout(() => (perfectElement.style.opacity = 0), 1000);
                  }

                  // === GEOCACHING ZIEL ÜBERPRÜFUNG (15 PUNKTE) ===
                  if (score >= 15 && !cacheKnacked) {
                      cacheKnacked = true;
                      
                      var secretBase64 = "TiA1MSAxMi4zNDUgRSAwMDkgNTYuNzg5";
                      
                      setTimeout(() => {
                          document.getElementById('secret-coords').innerText = atob(secretBase64);
                          document.getElementById('victory-popup').style.display = 'flex';
                      }, 500);
                  }

                  generatePlatform();
                  generateTree();
                  generateTree();
                }

                phase = "walking";
              }
              break;
            }
            case "walking": {
              heroX += (timestamp - lastTimestamp) / walkingSpeed;

              const [nextPlatform] = thePlatformTheStickHits();
              if (nextPlatform) {
                const maxHeroX = nextPlatform.x + nextPlatform.w - heroDistanceFromEdge;
                if (heroX > maxHeroX) {
                  heroX = maxHeroX;
                  phase = "transitioning";
                }
              } else {
                const maxHeroX = sticks.last().x + sticks.last().length + heroWidth;
                if (heroX > maxHeroX) {
                  heroX = maxHeroX;
                  phase = "falling";
                }
              }
              break;
            }
            case "transitioning": {
              sceneOffset += (timestamp - lastTimestamp) / transitioningSpeed;
              const [nextPlatform] = thePlatformTheStickHits();
              if (sceneOffset > nextPlatform.x + nextPlatform.w - paddingX) {
                sticks.push({
                  x: nextPlatform.x + nextPlatform.w,
                  length: 0,
                  rotation: 0
                });
                phase = "waiting";
              }
              break;
            }
            case "falling": {
              if (sticks.last().rotation < 180)
                sticks.last().rotation += (timestamp - lastTimestamp) / turningSpeed;

              heroY += (timestamp - lastTimestamp) / fallingSpeed;
              const maxHeroY = platformHeight + 100 + (window.innerHeight - canvasHeight) / 2;
              
              if (heroY > maxHeroY) {
                restartButton.style.display = "block";
                return;
              }
              break;
            }
            default:
              throw Error("Wrong phase");
          }

          draw();
          window.requestAnimationFrame(animate);
          lastTimestamp = timestamp;
        }

        function thePlatformTheStickHits() {
          if (sticks.last().rotation != 90)
            throw Error(`Stick is ${sticks.last().rotation}°`);
          const stickFarX = sticks.last().x + sticks.last().length;

          const platformTheStickHits = platforms.find(
            (platform) => platform.x < stickFarX && stickFarX < platform.x + platform.w
          );

          if (
            platformTheStickHits &&
            platformTheStickHits.x + platformTheStickHits.w / 2 - perfectAreaSize / 2 < stickFarX &&
            stickFarX < platformTheStickHits.x + platformTheStickHits.w / 2 + perfectAreaSize / 2
          )
            return [platformTheStickHits, true];

          return [platformTheStickHits, false];
        }

        function draw() {
          ctx.save();
          ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);

          drawBackground();

          ctx.translate(
            (window.innerWidth - canvasWidth) / 2 - sceneOffset,
            (window.innerHeight - canvasHeight) / 2
          );

          drawPlatforms();
          drawHero();
          drawSticks();

          ctx.restore();
        }

        restartButton.addEventListener("click", function (event) {
          event.preventDefault();
          event.stopPropagation(); 
          resetGame();
        });
        
        restartButton.addEventListener("touchstart", function (event) {
          event.preventDefault();
          event.stopPropagation(); 
          resetGame();
        });

        function drawPlatforms() {
          platforms.forEach(({ x, w }) => {
            ctx.fillStyle = "black";
            ctx.fillRect(
              x,
              canvasHeight - platformHeight,
              w,
              platformHeight + (window.innerHeight - canvasHeight) / 2
            );

            if (sticks.last().x < x) {
              ctx.fillStyle = "red";
              ctx.fillRect(
                x + w / 2 - perfectAreaSize / 2,
                canvasHeight - platformHeight,
                perfectAreaSize,
                perfectAreaSize
              );
            }
          });
        }

        function drawHero() {
          ctx.save();
          ctx.fillStyle = "black";
          ctx.translate(
            heroX - heroWidth / 2,
            heroY + canvasHeight - platformHeight - heroHeight / 2
          );

          drawRoundedRect(-heroWidth / 2, -heroHeight / 2, heroWidth, heroHeight - 4, 5);

          const legDistance = 5;
          ctx.beginPath();
          ctx.arc(legDistance, 11.5, 3, 0, Math.PI * 2, false);
          ctx.fill();
          ctx.beginPath();
          ctx.arc(-legDistance, 11.5, 3, 0, Math.PI * 2, false);
          ctx.fill();

          ctx.beginPath();
          ctx.fillStyle = "white";
          ctx.arc(5, -7, 3, 0, Math.PI * 2, false);
          ctx.fill();

          ctx.fillStyle = "red";
          ctx.fillRect(-heroWidth / 2 - 1, -12, heroWidth + 2, 4.5);
          ctx.beginPath();
          ctx.moveTo(-9, -14.5);
          ctx.lineTo(-17, -18.5);
          ctx.lineTo(-14, -8.5);
          ctx.fill();
          ctx.beginPath();
          ctx.moveTo(-10, -10.5);
          ctx.lineTo(-15, -3.5);
          ctx.lineTo(-5, -7);
          ctx.fill();

          ctx.restore();
        }

        function drawRoundedRect(x, y, width, height, radius) {
          ctx.beginPath();
          ctx.moveTo(x, y + radius);
          ctx.lineTo(x, y + height - radius);
          ctx.arcTo(x, y + height, x + radius, y + height, radius);
          ctx.lineTo(x + width - radius, y + height);
          ctx.arcTo(x + width, y + height, x + width, y + height - radius, radius);
          ctx.lineTo(x + width, y + radius);
          ctx.arcTo(x + width, y, x + width - radius, y, radius);
          ctx.lineTo(x + radius, y);
          ctx.arcTo(x, y, x, y + radius, radius);
          ctx.fill();
        }

        function drawSticks() {
          sticks.forEach((stick) => {
            ctx.save();
            ctx.translate(stick.x, canvasHeight - platformHeight);
            ctx.rotate((Math.PI / 180) * stick.rotation);
            ctx.beginPath();
            ctx.lineWidth = 2;
            ctx.moveTo(0, 0);
            ctx.lineTo(0, -stick.length);
            ctx.stroke();
            ctx.restore();
          });
        }

        function drawBackground() {
          var gradient = ctx.createLinearGradient(0, 0, 0, window.innerHeight);
          gradient.addColorStop(0, "#BBD691");
          gradient.addColorStop(1, "#FEF1E1");
          ctx.fillStyle = gradient;
          ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);

          drawHill(hill1BaseHeight, hill1Amplitude, hill1Stretch, "#95C629");
          drawHill(hill2BaseHeight, hill2Amplitude, hill2Stretch, "#659F1C");

          trees.forEach((tree) => drawTree(tree.x, tree.color));
        }

        function drawHill(baseHeight, amplitude, stretch, color) {
          ctx.beginPath();
          ctx.moveTo(0, window.innerHeight);
          ctx.lineTo(0, getHillY(0, baseHeight, amplitude, stretch));
          for (let i = 0; i < window.innerWidth; i++) {
            ctx.lineTo(i, getHillY(i, baseHeight, amplitude, stretch));
          }
          ctx.lineTo(window.innerWidth, window.innerHeight);
          ctx.fillStyle = color;
          ctx.fill();
        }

        function drawTree(x, color) {
          ctx.save();
          ctx.translate(
            (-sceneOffset * backgroundSpeedMultiplier + x) * hill1Stretch,
            getTreeY(x, hill1BaseHeight, hill1Amplitude)
          );

          const treeTrunkHeight = 5;
          const treeTrunkWidth = 2;
          const treeCrownHeight = 25;
          const treeCrownWidth = 10;

          ctx.fillStyle = "#7D833C";
          ctx.fillRect(-treeTrunkWidth / 2, -treeTrunkHeight, treeTrunkWidth, treeTrunkHeight);

          ctx.beginPath();
          ctx.moveTo(-treeCrownWidth / 2, -treeTrunkHeight);
          ctx.lineTo(0, -(treeTrunkHeight + treeCrownHeight));
          ctx.lineTo(treeCrownWidth / 2, -treeTrunkHeight);
          ctx.fillStyle = color;
          ctx.fill();

          ctx.restore();
        }

        function getHillY(windowX, baseHeight, amplitude, stretch) {
          const sineBaseY = window.innerHeight - baseHeight;
          return (Math.sinus((sceneOffset * backgroundSpeedMultiplier + windowX) * stretch) * amplitude + sineBaseY);
        }

        function getTreeY(x, baseHeight, amplitude) {
          const sineBaseY = window.innerHeight - baseHeight;
          return Math.sinus(x) * amplitude + sineBaseY;
        }
    </script>
</body>
</html>
